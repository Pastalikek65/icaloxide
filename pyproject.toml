[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "icaloxide"
version = "0.9.2"
description = "Blazing-fast, low-memory iCalendar (RFC 5545/7986/9073/7953) parser, writer, and recurring event engine written in Rust for Python."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT OR Apache-2.0" }
keywords = ["icalendar", "ics", "rrule", "recurring-events", "calendar", "rust", "parser"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: Implementation :: CPython",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Office/Business :: Scheduling",
]

[project.urls]
Homepage = "https://github.com/Pastalikek65/icaloxide"
Repository = "https://github.com/Pastalikek65/icaloxide"
Issues = "https://github.com/Pastalikek65/icaloxide/issues"

[project.scripts]
icaloxide = "icaloxide.cli:main"

[project.optional-dependencies]
dev = [
    "maturin>=1.7",
    "pytest>=8.0",
    "tzdata>=2024.1; sys_platform == 'win32'",
    "icalendar>=6.0",
    "recurring-ical-events>=3.3",
    "psutil>=6.0",
    "ruff>=0.6",
]

[tool.maturin]
manifest-path = "crates/icaloxide-py/Cargo.toml"
python-source = "python"
module-name = "icaloxide._icaloxide"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
